<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>404 – Page not found | Stackly Eats</title>
<meta name="description" content="The page you are looking for could not be found. Go back or return to the Stackly Eats home page." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#1E4D3B" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
/* ==========================================================
   Stackly Eats — 404 (uses the site's tokens + animations)
   ========================================================== */
:root{--cream:#FBF3E2;--cream2:#F3E6C9;--green:#1E4D3B;--green2:#2F6B52;--mango:#F4A71D;--chili:#D83A2E;--ink:#23201B;--white:#FFFDF8;--h:'Bricolage Grotesque',system-ui,sans-serif;--b:'DM Sans',system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{font-family:var(--b);background:#14352A;color:var(--cream);line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1{font-family:var(--h);font-weight:800;line-height:1.1;letter-spacing:-.02em;color:var(--white)}
:focus-visible{outline:3px solid var(--mango);outline-offset:3px;border-radius:6px}
.wrap{width:min(92%,1200px);margin-inline:auto}

/* ----- the site's keyframes (same names + timing as the other pages) ----- */
@keyframes rise{to{opacity:1;transform:none}}
@keyframes up{to{transform:none}}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.5)}}
@keyframes float{50%{transform:translateY(-14px)}}
@keyframes zoom{to{transform:scale(1)}}
@keyframes load{to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cOut{from{transform:none}to{transform:translateY(-100%)}}
@keyframes cIn{from{transform:translateY(100%)}to{transform:none}}


/* mango progress bar */
#bar{position:fixed;top:0;left:0;height:4px;width:100%;background:var(--mango);transform:scaleX(0);transform-origin:left;z-index:100;animation:load 1.1s var(--ease) .1s forwards}

/* buttons (same pill style as the site) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 28px;border-radius:50px;font:700 1rem var(--b);cursor:pointer;border:2px solid var(--green);background:var(--green);color:var(--cream);transition:transform .25s,background .25s,color .25s,border-color .25s}
.btn:hover{transform:translateY(-3px)}
.btn svg{transition:transform .3s}
.btn.mango{background:var(--mango);color:var(--ink);border-color:var(--mango)}
.btn.mango:hover{background:var(--chili);border-color:var(--chili);color:#fff}
.btn.mango:hover svg{transform:translateX(4px)}
.btn.ghost{background:transparent;color:var(--cream);border-color:var(--cream)}
.btn.ghost:hover{background:var(--cream);color:var(--green)}
.btn.ghost:hover svg{transform:translateX(-4px)}

/* ---------- 404 page ---------- */
.e404{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;overflow:hidden;padding:clamp(2rem,6vh,4rem) 0;color:var(--cream)}
.e404 .ph{position:absolute;inset:-8% 0;z-index:0;background:#14352A;overflow:hidden}
.e404 .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4;transform:scale(1.12);animation:zoom 2.4s var(--ease) forwards}
.e404::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(60% 55% at 85% 8%,rgba(244,167,29,.24),transparent 70%),radial-gradient(55% 60% at 8% 92%,rgba(216,58,46,.28),transparent 70%),linear-gradient(0deg,rgba(20,53,42,.94),rgba(30,77,59,.8) 60%,rgba(30,77,59,.66))}
.e404 .wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.tag{display:inline-block;background:var(--mango);color:var(--ink);padding:6px 18px;border-radius:40px;font-weight:700;font-size:.9rem;margin-bottom:.6rem;animation:pop .8s .1s both}
.e404-num{display:flex;align-items:center;justify-content:center;gap:.04em;font-family:var(--h);font-weight:800;font-size:clamp(5.5rem,24vw,13rem);line-height:1;color:var(--cream);letter-spacing:-.04em;margin:.1em 0 .18em;user-select:none;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.e404-num>span{display:block;transform:translateY(110%);opacity:0;animation:up .9s var(--ease) .1s forwards,show .9s .1s forwards}
.e404-num>span:nth-child(2){animation-delay:.18s}
.e404-num>span:last-child{animation-delay:.26s}
/* heading reveals line by line */
.e404 h1{font-size:clamp(1.9rem,5vw,3.2rem);max-width:24ch;margin-bottom:1rem;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.e404 h1 span{display:block;overflow:hidden;padding-bottom:.08em}
.e404 h1 b{display:inline-block;font-weight:800;transform:translateY(110%);animation:up .9s var(--ease) .1s forwards}
.e404 h1 span:nth-child(2) b{animation-delay:.25s}
.e404 h1 i{font-style:normal;color:var(--mango)}
.e404 p.lead{max-width:52ch;margin-bottom:2rem;color:var(--cream2);font-size:1.1rem;opacity:0;animation:show .8s .7s forwards}
.e404 .btn-row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;opacity:0;animation:show .8s .9s forwards}
@media (max-width:600px){
  .e404 .btn-row{flex-direction:column;align-items:stretch;width:100%;max-width:340px}
  .e404 .btn{width:100%}
  .e404 p.lead{margin-bottom:1.6rem}
}
@media (max-width:380px){.e404-num{font-size:clamp(4.6rem,25vw,5.5rem)}}
@media (max-height:560px) and (orientation:landscape){
  .e404{min-height:auto;padding:1.5rem 0}
  .e404-num{font-size:clamp(4rem,16vh,6.5rem);margin:.05em 0 .1em}
  .e404 h1{font-size:1.6rem;margin-bottom:.6rem}
  .e404 p.lead{margin-bottom:1.2rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #bar{transform:scaleX(1)}
  .e404-num>span,.e404 h1 b{transform:none;opacity:1}
  .e404 p.lead,.e404 .btn-row{opacity:1}
  .e404 .ph img{transform:none}
}
</style>
<link rel="stylesheet" href="preloader.css">
</head>
<body>
<div id="preloader" role="status" aria-live="polite" aria-label="Loading">
<div class="pl-scene">
<i class="pl-speed s1"></i><i class="pl-speed s2"></i><i class="pl-speed s3"></i>
<div class="pl-ride">
<svg viewBox="0 0 130 90" aria-hidden="true">
<rect x="4" y="28" width="30" height="26" rx="5" fill="#F4A71D"/><rect x="4" y="38" width="30" height="5" fill="#D83A2E"/>
<path d="M30 56h46c6 0 10-4 12-10l4-14" fill="none" stroke="#FBF3E2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M88 34l-4-12M80 22h12" fill="none" stroke="#FBF3E2" stroke-width="5" stroke-linecap="round"/>
<rect x="34" y="42" width="34" height="9" rx="4.5" fill="#D83A2E"/>
<path d="M46 40l8-16 12 4-4 14z" fill="#F4A71D"/>
<circle cx="52" cy="14" r="9" fill="#FBF3E2"/><path d="M43 14a9 9 0 0 1 18 0z" fill="#D83A2E"/>
<path d="M60 26l22-2" stroke="#F4A71D" stroke-width="5" stroke-linecap="round"/>
<g class="pl-wheel"><circle cx="26" cy="72" r="12" fill="#23201B" stroke="#FBF3E2" stroke-width="3"/><path d="M26 62v20M16 72h20" stroke="#FBF3E2" stroke-width="2"/></g>
<g class="pl-wheel"><circle cx="100" cy="72" r="12" fill="#23201B" stroke="#FBF3E2" stroke-width="3"/><path d="M100 62v20M90 72h20" stroke="#FBF3E2" stroke-width="2"/></g>
</svg>
</div>
<div class="pl-road"></div>
</div>
<img class="pl-brand" src="stackly-white-logo.webp" alt="Stackly Eats">
</div>
<noscript><style>#preloader{display:none!important}body.pl-lock{overflow:auto!important}</style></noscript>


<div id="bar"></div>
<main id="main">
<section class="e404">
  <div class="ph">
    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1800&q=70" alt="" decoding="async" />
  </div>
  <div class="wrap">
    <span class="tag">Error 404</span>
    <div class="e404-num" aria-hidden="true"><span>4</span><span>0</span><span>4</span></div>
    <h1><span><b>We could not find</b></span><span><b>that <i>page</i></b></span></h1>
    <p class="lead">The page you are looking for may have moved, been renamed or never made it out of the kitchen. Go back to where you were, or head home to browse our menu and order.</p>
    <div class="btn-row">
      <button type="button" class="btn ghost back" id="goBack"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>Go back</span></button>
      <a class="btn mango" href="index.html"><span>Back to home</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </div>
</section>
</main>

<script>
(function(){
  /* go back to the previous page and restore its scroll position */
  try{if('scrollRestoration' in history)history.scrollRestoration='auto'}catch(_){}
  var b=document.getElementById('goBack');
  if(!b)return;
  b.addEventListener('click',function(){
    if(window.history.length>1){
      var t=setTimeout(function(){window.location.href='index.html'},900);
      var stop=function(){clearTimeout(t)};
      window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',stop);
      window.history.back();
    }else{window.location.href='index.html'}
  });
})();
</script>
<script src="preloader.js"></script>
</body>
</html>
